[package]
name = "ggr"
version = "0.1.0"
edition = "2021"
description = "Probe which IO operations a model reaches for on a prompt, then generate a Claude Code skill from it"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
